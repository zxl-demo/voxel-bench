server.port=8080
spring.application.name=voxel-java

# SPEC v2 defaults; override with VOXEL_TURN_SECONDS / VOXEL_BLOCKS_PER_TURN / VOXEL_PLACERS_MAX / VOXEL_QUEUE_MAX_LENGTH
voxel.turn-seconds=30
voxel.blocks-per-turn=5
voxel.placers-max=3
voxel.queue-max-length=20

logging.level.root=INFO
logging.level.com.example.voxel=INFO
