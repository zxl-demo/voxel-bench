server.port=8080
spring.application.name=voxel-java

# SPEC v3 defaults; override with VOXEL_TURN_SECONDS / VOXEL_BLOCKS_PER_TURN / VOXEL_DELETES_PER_TURN / VOXEL_PLACERS_MAX / VOXEL_QUEUE_MAX_LENGTH / VOXEL_ALLOWED_ORIGINS
voxel.turn-seconds=30
voxel.blocks-per-turn=5
voxel.deletes-per-turn=1
voxel.placers-max=3
voxel.queue-max-length=20
# empty = no Origin check on the WebSocket handshake (local dev only);
# production sets the page origin, e.g. https://18443-....instabox.tech
voxel.allowed-origins=
# v4: JSON world snapshot path; empty = persistence disabled (local dev).
# production sets VOXEL_PERSISTENCE_FILE=/data/voxel/world.json (PVC mount).
voxel.persistence-file=

logging.level.root=INFO
logging.level.com.example.voxel=INFO
