apiVersion: v1
kind: Service
metadata:
  name: voxel-java
  namespace: voxel
  labels:
    app: voxel-java
spec:
  type: ClusterIP
  selector:
    app: voxel-java
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Host-less, path-only ingress: gateway rewrites Host, host rules never match
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voxel-public
  namespace: voxel
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: voxel-strip-voxel@kubernetescrd,voxel-fix-host@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /voxel
            pathType: Prefix
            backend:
              service:
                name: voxel-java
                port:
                  number: 80
